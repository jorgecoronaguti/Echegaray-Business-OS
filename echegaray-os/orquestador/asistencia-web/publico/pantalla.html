<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Asistencia</title>
<link rel="stylesheet" href="{{BASE}}/pantalla.css">
</head>
<body data-base="{{BASE}}">

<header class="barra">
  <h1>Asistencia</h1>
  <p class="jornada" id="jornada"></p>
</header>

<section class="filtros">
  <label class="campo">
    <span>Fecha</span>
    <input type="date" id="fecha" required>
  </label>
  <label class="campo">
    <span>Obra</span>
    <select id="obra"><option value="">Cargando…</option></select>
  </label>
</section>

<p class="aviso" id="aviso" hidden></p>

<section class="resumen" id="resumen" hidden>
  <span><b id="rPresentes">0</b> presentes</span>
  <span><b id="rAusentes">0</b> ausentes</span>
  <span><b id="rHoras">0</b> h</span>
  <span class="extra" id="rExtraCaja" hidden><b id="rExtra">0</b> h extra</span>
</section>

<ul class="lista" id="lista"></ul>

<footer class="pie">
  <button type="button" id="registrar" class="primario" disabled>Registrar</button>
</footer>

<template id="tplFila">
  <li class="fila">
    <div class="principal">
      <label class="presencia">
        <input type="checkbox" class="presente" checked>
        <span class="nombre"></span>
      </label>
      <span class="horas">
        <input type="number" class="hs" inputmode="decimal" step="0.5" min="0" max="24" aria-label="Horas">
        <span class="u">h</span>
      </span>
      <button type="button" class="mas" aria-label="Más opciones" aria-expanded="false">···</button>
    </div>
    <p class="pistas"><span class="chip previo" hidden></span><span class="chip extra" hidden></span><span class="chip alerta" hidden></span></p>
    <div class="detalle" hidden>
      <label class="campo motivo-campo" hidden>
        <span>Motivo</span>
        <select class="motivo"></select>
      </label>
      <label class="campo aclaracion-campo" hidden>
        <span>Aclaración</span>
        <input type="text" class="aclaracion" maxlength="120" autocomplete="off">
      </label>
      <label class="campo obra-campo">
        <span>Trabajó en otra obra</span>
        <select class="obra-realizada"></select>
      </label>
    </div>
  </li>
</template>

<script src="{{BASE}}/pantalla.js"></script>
</body>
</html>
