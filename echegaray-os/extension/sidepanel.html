<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0e1118; --panel:#161b25; --ink:#e6eaf2; --soft:#aab3c5; --faint:#7b8698;
    --line:#2a323f; --accent:#6f9dea; --ok:#4bbd85; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg);
    color:var(--ink); font-size:14px; display:flex; flex-direction:column; height:100vh; }
  header { padding:12px 14px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px; }
  header .dot { width:9px; height:9px; border-radius:50%; background:var(--faint); }
  header .dot.on { background:var(--ok); }
  header h1 { font-size:14px; margin:0; font-weight:700; letter-spacing:-.01em; }
  header .gear { margin-left:auto; cursor:pointer; color:var(--faint); background:none; border:0; font-size:16px; }
  #chat { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:12px; }
  .msg { padding:10px 12px; border-radius:12px; max-width:92%; line-height:1.5; white-space:pre-wrap; }
  .me { align-self:flex-end; background:var(--accent); color:#0b1220; font-weight:500; }
  .os { align-self:flex-start; background:var(--panel); border:1px solid var(--line); }
  .os .meta { color:var(--faint); font-size:11px; margin-top:6px; }
  .hint { color:var(--faint); font-size:12px; text-align:center; padding:20px; line-height:1.5; }
  footer { padding:10px; border-top:1px solid var(--line); display:flex; gap:8px; }
  textarea { flex:1; resize:none; background:var(--panel); color:var(--ink); border:1px solid var(--line);
    border-radius:10px; padding:9px 11px; font-family:inherit; font-size:14px; height:44px; }
  button.send { background:var(--accent); color:#0b1220; border:0; border-radius:10px; padding:0 16px;
    font-weight:700; cursor:pointer; }
  button.send:disabled { opacity:.5; cursor:default; }
  #settings { display:none; padding:14px; border-bottom:1px solid var(--line); background:var(--panel); }
  #settings.show { display:block; }
  #settings label { display:block; font-size:12px; color:var(--soft); margin:8px 0 4px; }
  #settings input { width:100%; background:var(--bg); color:var(--ink); border:1px solid var(--line);
    border-radius:8px; padding:8px; font-size:13px; }
  #settings .save { margin-top:12px; background:var(--ok); color:#06210f; border:0; border-radius:8px;
    padding:8px 14px; font-weight:700; cursor:pointer; }
  .tabs { display:flex; border-bottom:1px solid var(--line); }
  .tabs button { flex:1; background:none; border:0; color:var(--soft); padding:9px 0; font-size:13px;
    font-weight:600; cursor:pointer; border-bottom:2px solid transparent; font-family:inherit; }
  .tabs button.active { color:var(--ink); border-bottom-color:var(--accent); }
  .tabs .badge { display:inline-block; min-width:17px; padding:0 5px; margin-left:5px; border-radius:9px;
    background:var(--accent); color:#0b1220; font-size:11px; font-weight:700; }
  .tabs .badge[data-n="0"] { display:none; }
  #pending { flex:1; overflow-y:auto; padding:14px; display:none; flex-direction:column; gap:10px; }
  #pending.show { display:flex; }
  .op { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:11px 12px; }
  .op .cap { font-weight:700; font-size:12px; color:var(--accent); }
  .op .tgt { color:var(--soft); font-size:12px; margin:6px 0; white-space:pre-wrap; word-break:break-word; }
  .op .acts { display:flex; gap:8px; margin-top:8px; }
  .op .acts button { border:0; border-radius:8px; padding:6px 12px; font-weight:700; cursor:pointer; font-size:12px; font-family:inherit; }
  .op .ok { background:var(--ok); color:#06210f; }
  .op .no { background:#2a323f; color:var(--soft); }
  .op.done { opacity:.5; }
</style>
</head>
<body>
  <header>
    <span class="dot" id="status"></span>
    <h1>Echegaray OS</h1>
    <button class="gear" id="gear" title="Configuración">⚙</button>
  </header>
  <div id="settings">
    <label>Dirección del OS</label>
    <input id="addr" placeholder="https://echegaray-business-os.vercel.app/api/os">
    <label>Llave de acceso</label>
    <input id="token" type="password" placeholder="pegá tu llave">
    <button class="save" id="save">Guardar</button>
  </div>
  <div class="tabs">
    <button id="tabChat" class="active" data-view="chat">Chat</button>
    <button id="tabPending" data-view="pending">Pendientes<span class="badge" id="pcount" data-n="0">0</span></button>
  </div>
  <div id="chat">
    <div class="hint" id="hint">Abrí un archivo de Drive o Sheets y escribí una directiva.<br>Ej: "¿cuánto tengo en caja hoy?" · "revisá esta planilla" · "ordená esta planilla" · "registrá esta compra".</div>
  </div>
  <div id="pending">
    <div class="hint" id="phint">No hay operaciones esperando tu aprobación.</div>
  </div>
  <footer>
    <textarea id="input" placeholder="Escribí una directiva…"></textarea>
    <button class="send" id="send">Enviar</button>
  </footer>
  <script src="sidepanel.js"></script>
</body>
</html>
