<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0e1118; --panel:#161b25; --ink:#e6eaf2; --soft:#aab3c5; --faint:#7b8698;
    --line:#2a323f; --accent:#6f9dea; --ok:#4bbd85; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg);
    color:var(--ink); font-size:14px; display:flex; flex-direction:column; height:100vh; }
  header { padding:12px 14px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px; }
  header .dot { width:9px; height:9px; border-radius:50%; background:var(--faint); }
  header .dot.on { background:var(--ok); }
  header h1 { font-size:14px; margin:0; font-weight:700; letter-spacing:-.01em; }
  header .gear { margin-left:auto; cursor:pointer; color:var(--faint); background:none; border:0; font-size:16px; }
  #chat { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:12px; }
  .msg { padding:10px 12px; border-radius:12px; max-width:92%; line-height:1.5; white-space:pre-wrap; }
  .me { align-self:flex-end; background:var(--accent); color:#0b1220; font-weight:500; }
  .os { align-self:flex-start; background:var(--panel); border:1px solid var(--line); }
  .os .meta { color:var(--faint); font-size:11px; margin-top:6px; }
  .hint { color:var(--faint); font-size:12px; text-align:center; padding:20px; line-height:1.5; }
  footer { padding:10px; border-top:1px solid var(--line); display:flex; gap:8px; }
  textarea { flex:1; resize:vertical; background:var(--panel); color:var(--ink); border:1px solid var(--line);
    border-radius:10px; padding:9px 11px; font-family:inherit; font-size:14px; min-height:44px; max-height:260px; }
  button.send { background:var(--accent); color:#0b1220; border:0; border-radius:10px; padding:0 16px;
    font-weight:700; cursor:pointer; align-self:stretch; }
  button.send:disabled { opacity:.5; cursor:default; }
  button.send.stop { background:#e5534b; color:#fff; }
  button.attach { background:var(--panel); color:var(--soft); border:1px solid var(--line); border-radius:10px;
    width:44px; font-size:17px; cursor:pointer; }
  #chip { display:none; align-items:center; gap:8px; margin:0 10px; padding:7px 10px; background:var(--panel);
    border:1px solid var(--line); border-top:0; border-radius:0 0 10px 10px; font-size:12px; color:var(--soft); }
  #chip.show { display:flex; }
  #chip .x { margin-left:auto; cursor:pointer; color:var(--faint); font-weight:700; }
  #settings { display:none; padding:14px; border-bottom:1px solid var(--line); background:var(--panel); }
  #settings.show { display:block; }
  #chats { display:none; padding:12px; border-bottom:1px solid var(--line); background:var(--panel); max-height:50vh; overflow-y:auto; }
  #chats.show { display:block; }
  .chatrow { display:flex; align-items:center; gap:8px; padding:9px 10px; border:1px solid var(--line); border-radius:8px;
    margin-bottom:6px; cursor:pointer; font-size:13px; background:var(--bg); }
  .chatrow:hover { border-color:var(--accent); }
  .chatrow.active { border-color:var(--accent); }
  .chatrow .ti { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chatrow .del { color:var(--faint); cursor:pointer; font-weight:700; }
  #settings label { display:block; font-size:12px; color:var(--soft); margin:8px 0 4px; }
  #settings input { width:100%; background:var(--bg); color:var(--ink); border:1px solid var(--line);
    border-radius:8px; padding:8px; font-size:13px; }
  #settings .save { margin-top:12px; background:var(--ok); color:#06210f; border:0; border-radius:8px;
    padding:8px 14px; font-weight:700; cursor:pointer; }
  .tabs { display:flex; border-bottom:1px solid var(--line); }
  .tabs button { flex:1; background:none; border:0; color:var(--soft); padding:9px 0; font-size:13px;
    font-weight:600; cursor:pointer; border-bottom:2px solid transparent; font-family:inherit; }
  .tabs button.active { color:var(--ink); border-bottom-color:var(--accent); }
  .tabs .badge { display:inline-block; min-width:17px; padding:0 5px; margin-left:5px; border-radius:9px;
    background:var(--accent); color:#0b1220; font-size:11px; font-weight:700; }
  .tabs .badge[data-n="0"] { display:none; }
  #pending { flex:1; overflow-y:auto; padding:14px; display:none; flex-direction:column; gap:10px; }
  #pending.show { display:flex; }
  .op { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:11px 12px; }
  .op .cap { font-weight:700; font-size:12px; color:var(--accent); }
  .op .tgt { color:var(--soft); font-size:12px; margin:6px 0; white-space:pre-wrap; word-break:break-word; }
  .op .acts { display:flex; gap:8px; margin-top:8px; }
  .op .acts button { border:0; border-radius:8px; padding:6px 12px; font-weight:700; cursor:pointer; font-size:12px; font-family:inherit; }
  .op .ok { background:var(--ok); color:#06210f; }
  .op .no { background:#2a323f; color:var(--soft); }
  .op.done { opacity:.5; }
  #agenda { flex:1; overflow-y:auto; padding:14px; display:none; flex-direction:column; gap:10px; }
  #agenda.show { display:flex; }
  .agform { display:flex; flex-direction:column; gap:8px; background:var(--panel); border:1px solid var(--line);
    border-radius:12px; padding:11px 12px; }
  .agform input, .agform select { background:var(--bg); color:var(--ink); border:1px solid var(--line);
    border-radius:8px; padding:8px; font-size:13px; font-family:inherit; }
  .agform button { background:var(--accent); color:#0b1220; border:0; border-radius:8px; padding:8px; font-weight:700; cursor:pointer; }
  .sch { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 12px; font-size:12px; }
  .sch .t { font-weight:700; color:var(--ink); }
  .sch .c { color:var(--accent); font-size:11px; }
  .sch .r { color:var(--soft); margin-top:5px; white-space:pre-wrap; }
  .sch .off { opacity:.5; }
  .sch .tog { float:right; cursor:pointer; color:var(--faint); font-size:11px; font-weight:700; }
</style>
</head>
<body>
  <header>
    <span class="dot" id="status"></span>
    <h1>Echegaray OS</h1>
    <span id="ver" style="color:var(--faint);font-size:11px;font-weight:600"></span>
    <button class="gear" id="chatsBtn" title="Conversaciones" style="margin-left:auto">🗂</button>
    <button class="gear" id="gear" title="Configuración">⚙</button>
  </header>
  <div id="settings">
    <label>Dirección del OS</label>
    <input id="addr" placeholder="https://echegaray-business-os.vercel.app/api/os">
    <label>Llave de acceso</label>
    <input id="token" type="password" placeholder="pegá tu llave">
    <label>Tu email (@ecsas.com.ar)</label>
    <input id="email" placeholder="tu.mail@ecsas.com.ar">
    <button class="save" id="save">Guardar</button>
    <button class="save" id="gauth" style="margin-top:8px;background:#4285f4;color:#fff">Conectar con Google</button>
    <div id="gauthmsg" style="font-size:11px;color:var(--soft);margin-top:6px"></div>
  </div>
  <div id="chats">
    <button class="save" id="newchat" style="width:100%;margin:0 0 10px">＋ Nuevo chat</button>
    <div id="chatslist"></div>
  </div>
  <div class="tabs">
    <button id="tabChat" class="active" data-view="chat">Chat</button>
    <button id="tabPending" data-view="pending">Pendientes<span class="badge" id="pcount" data-n="0">0</span></button>
    <button id="tabAgenda" data-view="agenda">Agenda</button>
  </div>
  <div id="chat">
    <div class="hint" id="hint">Abrí un archivo de Drive o Sheets y escribí una directiva.<br>Ej: "¿cuánto tengo en caja hoy?" · "revisá esta planilla" · "ordená esta planilla" · "registrá esta compra".</div>
  </div>
  <div id="pending">
    <div class="hint" id="phint">No hay operaciones esperando tu aprobación.</div>
  </div>
  <div id="agenda">
    <div class="agform">
      <input id="agdir" placeholder="Qué revisar… ej: revisá cobranzas vencidas y avisame">
      <select id="agcad">
        <option value="daily:08:00">Todos los días · 08:00</option>
        <option value="weekly:lun:09:00">Lunes · 09:00</option>
        <option value="weekly:vie:17:00">Viernes · 17:00</option>
        <option value="monthly:01:09:00">Día 1 del mes · 09:00</option>
      </select>
      <button id="agadd">Programar</button>
    </div>
    <div id="aglist"></div>
  </div>
  <div id="chip"><span id="chipname"></span><span class="x" id="chipx" title="Quitar">✕</span></div>
  <footer>
    <input type="file" id="file" accept="image/*,application/pdf" hidden>
    <button class="attach" id="attach" title="Adjuntar foto o PDF">📎</button>
    <textarea id="input" placeholder="Escribí una directiva…"></textarea>
    <button class="send" id="send">Enviar</button>
  </footer>
  <script src="sidepanel.js"></script>
</body>
</html>
